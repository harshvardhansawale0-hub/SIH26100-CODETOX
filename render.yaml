services:
  - type: web
    name: gem-procure-backend
    env: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
